<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expense Tracker</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- jsPDF & AutoTable for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Hide number input spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#10b981',
                        dark: '#1e293b',
                        light: '#f8fafc'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen pb-24 md:pb-0">

    <!-- Mobile Container -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl relative overflow-hidden md:my-10 md:min-h-[850px] md:rounded-3xl md:h-auto border-gray-100 md:border">
        
        <!-- Header Section -->
        <header class="bg-primary text-white p-6 rounded-b-3xl shadow-lg relative">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-xl font-bold tracking-wide">ExpenseTrack</h1>
                    <p id="current-month" class="text-primary-100 text-sm opacity-80">...</p>
                </div>
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm cursor-pointer">
                    <i class="fas fa-bell"></i>
                </div>
            </div>
            
            <div class="text-center mb-2">
                <p class="text-sm opacity-80 uppercase tracking-wider font-semibold">Total Balance</p>
                <h2 id="total-spent" class="text-4xl font-extrabold mt-1 tracking-tight">$0.00</h2>
            </div>
            
            <div class="flex justify-between mt-6 text-sm bg-white/10 rounded-xl p-3 backdrop-blur-md border border-white/20">
                <div class="text-center w-1/2 border-r border-white/20">
                    <p class="opacity-70"><i class="fas fa-arrow-down mr-1 text-green-300"></i>Income</p>
                    <p id="total-income" class="font-bold text-lg">$0.00</p>
                </div>
                <div class="text-center w-1/2">
                    <p class="opacity-70"><i class="fas fa-arrow-up mr-1 text-red-300"></i>Expenses</p>
                    <p id="total-expenses" class="font-bold text-lg">$0.00</p>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-5 pt-6">
            
            <!-- Add Form -->
            <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-8 transform -translate-y-2 relative z-10">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-gray-800">Add Transaction</h3>
                </div>
                
                <form id="expense-form" class="space-y-4">
                    
                    <!-- Type Toggle -->
                    <div class="flex gap-4 mb-4">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="type" value="expense" class="peer sr-only" checked>
                            <div class="text-center py-2 bg-gray-100 text-gray-600 rounded-xl text-sm font-bold peer-checked:bg-red-500 peer-checked:text-white transition-colors">Expense</div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="type" value="income" class="peer sr-only">
                            <div class="text-center py-2 bg-gray-100 text-gray-600 rounded-xl text-sm font-bold peer-checked:bg-green-500 peer-checked:text-white transition-colors">Income</div>
                        </label>
                    </div>

                    <!-- Amount Input -->
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="text-gray-500 font-bold text-lg">$</span>
                        </div>
                        <input type="number" id="amount" placeholder="0.00" step="0.01" class="block w-full pl-8 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-xl font-semibold text-gray-800 focus:ring-2 focus:ring-primary focus:border-primary focus:bg-white transition-all outline-none" required>
                    </div>

                    <!-- Description Input -->
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-pen text-gray-400"></i>
                        </div>
                        <input type="text" id="description" placeholder="What was this for?" class="block w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-md text-gray-800 focus:ring-2 focus:ring-primary focus:border-primary focus:bg-white transition-all outline-none" required>
                    </div>

                    <!-- Category Chips -->
                    <div>
                        <p class="text-sm font-semibold text-gray-600 mb-2">Category</p>
                        <div class="flex overflow-x-auto space-x-2 pb-2 -mx-1 px-1 scrollbar-hide" style="scrollbar-width: none; -ms-overflow-style: none;">
                            <label class="flex-shrink-0 cursor-pointer">
                                <input type="radio" name="category" value="general" class="peer sr-only" checked>
                                <div class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium peer-checked:bg-primary peer-checked:text-white transition-colors border border-transparent peer-checked:shadow-md hover:bg-gray-200">
                                    <i class="fas fa-border-all mr-1"></i> General
                                </div>
                            </label>
                            <label class="flex-shrink-0 cursor-pointer">
                                <input type="radio" name="category" value="salary" class="peer sr-only">
                                <div class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium peer-checked:bg-green-600 peer-checked:text-white transition-colors border border-transparent peer-checked:shadow-md hover:bg-gray-200">
                                    <i class="fas fa-money-bill-wave mr-1"></i> Salary
                                </div>
                            </label>
                            <label class="flex-shrink-0 cursor-pointer">
                                <input type="radio" name="category" value="food" class="peer sr-only">
                                <div class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium peer-checked:bg-orange-500 peer-checked:text-white transition-colors border border-transparent peer-checked:shadow-md hover:bg-gray-200">
                                    <i class="fas fa-hamburger mr-1"></i> Food
                                </div>
                            </label>
                            <label class="flex-shrink-0 cursor-pointer">
                                <input type="radio" name="category" value="transport" class="peer sr-only">
                                <div class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium peer-checked:bg-blue-500 peer-checked:text-white transition-colors border border-transparent peer-checked:shadow-md hover:bg-gray-200">
                                    <i class="fas fa-bus mr-1"></i> Transport
                                </div>
                            </label>
                            <label class="flex-shrink-0 cursor-pointer">
                                <input type="radio" name="category" value="rent" class="peer sr-only">
                                <div class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium peer-checked:bg-purple-500 peer-checked:text-white transition-colors border border-transparent peer-checked:shadow-md hover:bg-gray-200">
                                    <i class="fas fa-home mr-1"></i> Rent
                                </div>
                            </label>
                            <label class="flex-shrink-0 cursor-pointer">
                                <input type="radio" name="category" value="utilities" class="peer sr-only">
                                <div class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium peer-checked:bg-yellow-500 peer-checked:text-white transition-colors border border-transparent peer-checked:shadow-md hover:bg-gray-200">
                                    <i class="fas fa-bolt mr-1"></i> Utilities
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full bg-primary hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-200 transform transition-transform active:scale-95 flex items-center justify-center mt-2">
                        <i class="fas fa-plus-circle mr-2 text-lg"></i> Add Transaction
                    </button>
                </form>
            </section>

            <!-- Recent Transactions List -->
            <section>
                <div class="flex justify-between items-end mb-4">
                    <h3 class="text-lg font-bold text-gray-800">Recent Transactions</h3>
                </div>
                
                <div id="transaction-list" class="space-y-3">
                    <!-- Transactions will be injected here via JavaScript -->
                </div>

                <!-- Export to PDF Button -->
                <div class="mt-6 pt-4 border-t border-gray-100">
                    <button onclick="exportToPDF()" class="w-full bg-dark hover:bg-gray-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transform transition-transform active:scale-95 flex items-center justify-center">
                        <i class="fas fa-file-pdf mr-2 text-lg text-red-400"></i> Export Report to PDF
                    </button>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation for Mobile -->
        <nav class="md:hidden fixed bottom-0 w-full max-w-md bg-white border-t border-gray-200 flex justify-around items-center h-16 px-4 z-50">
            <a href="#" class="flex flex-col items-center justify-center w-full text-primary">
                <i class="fas fa-home text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Home</span>
            </a>
            <a href="#" class="flex flex-col items-center justify-center w-full text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fas fa-chart-pie text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Stats</span>
            </a>
            <div class="relative w-full flex justify-center">
                <a href="#" class="absolute -top-8 w-14 h-14 bg-primary text-white rounded-full flex items-center justify-center shadow-lg shadow-indigo-300 border-4 border-white transform transition-transform hover:scale-105">
                    <i class="fas fa-plus text-xl"></i>
                </a>
            </div>
            <a href="#" class="flex flex-col items-center justify-center w-full text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fas fa-wallet text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Wallet</span>
            </a>
            <a href="#" class="flex flex-col items-center justify-center w-full text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fas fa-user text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Profile</span>
            </a>
        </nav>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('ServiceWorker registered');
                }).catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }

        // Set Current Month Header
        document.getElementById('current-month').innerText = new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        // Constants & Configuration
        const categoryConfig = {
            general: { icon: 'fas fa-border-all', bg: 'bg-gray-100', text: 'text-gray-600' },
            salary: { icon: 'fas fa-money-bill-wave', bg: 'bg-green-100', text: 'text-green-600' },
            food: { icon: 'fas fa-hamburger', bg: 'bg-orange-100', text: 'text-orange-500' },
            transport: { icon: 'fas fa-bus', bg: 'bg-blue-100', text: 'text-blue-500' },
            rent: { icon: 'fas fa-home', bg: 'bg-purple-100', text: 'text-purple-500' },
            utilities: { icon: 'fas fa-bolt', bg: 'bg-yellow-100', text: 'text-yellow-600' }
        };

        // DOM Elements
        const form = document.getElementById('expense-form');
        const amountInput = document.getElementById('amount');
        const descriptionInput = document.getElementById('description');
        const transactionList = document.getElementById('transaction-list');
        const totalSpentEl = document.getElementById('total-spent');
        const totalExpensesEl = document.getElementById('total-expenses');
        const totalIncomeEl = document.getElementById('total-income');

        // State
        let transactions = JSON.parse(localStorage.getItem('expenseTracker_transactions')) || [];

        // Format Date
        const formatDate = (dateString) => {
            const date = new Date(dateString);
            const today = new Date();
            
            if (date.toDateString() === today.toDateString()) {
                return 'Today, ' + date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            }
            
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            if (date.toDateString() === yesterday.toDateString()) {
                return 'Yesterday, ' + date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            }

            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        };

        // Format Currency
        const formatCurrency = (amount) => {
            return '$' + parseFloat(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        // Update UI
        const updateUI = () => {
            // Calculate Totals
            const tIncome = transactions.filter(t => t.type === 'income').reduce((acc, curr) => acc + curr.amount, 0);
            const tExpense = transactions.filter(t => t.type === 'expense').reduce((acc, curr) => acc + curr.amount, 0);
            const balance = tIncome - tExpense;
            
            // Update Totals Display
            totalSpentEl.innerText = formatCurrency(balance);
            totalIncomeEl.innerText = formatCurrency(tIncome);
            totalExpensesEl.innerText = formatCurrency(tExpense);

            // Render List
            transactionList.innerHTML = '';
            
            if (transactions.length === 0) {
                transactionList.innerHTML = '<p class="text-center text-gray-500 py-6 text-sm">No recent transactions. Add one above!</p>';
                return;
            }

            // Sort transactions by date (newest first)
            const sortedTransactions = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedTransactions.forEach(transaction => {
                const catConf = categoryConfig[transaction.category] || categoryConfig.general;
                const catName = transaction.category.charAt(0).toUpperCase() + transaction.category.slice(1);
                
                const isIncome = transaction.type === 'income';
                const sign = isIncome ? '+' : '-';
                const amountColor = isIncome ? 'text-green-500' : 'text-gray-800';
                
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-3 bg-white border border-gray-100 rounded-xl hover:shadow-sm transition-shadow group relative overflow-hidden';
                item.innerHTML = `
                    <div class="flex items-center gap-3 w-full">
                        <div class="w-12 h-12 rounded-xl flex-shrink-0 ${catConf.bg} ${catConf.text} flex items-center justify-center text-xl shadow-inner">
                            <i class="${catConf.icon}"></i>
                        </div>
                        <div class="flex-grow overflow-hidden pr-2">
                            <h4 class="font-bold text-gray-800 text-base leading-tight truncate">${transaction.description}</h4>
                            <p class="text-xs text-gray-500 mt-1 truncate">${formatDate(transaction.date)} • ${catName}</p>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <p class="font-bold ${amountColor} text-base">${sign}${formatCurrency(transaction.amount)}</p>
                        </div>
                    </div>
                    
                    <!-- Delete Button overlay on hover/focus -->
                    <div class="absolute right-0 top-0 bottom-0 bg-gradient-to-l from-white via-white to-transparent w-20 flex items-center justify-end pr-3 opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity">
                        <button onclick="deleteTransaction('${transaction.id}')" class="w-8 h-8 bg-red-100 text-red-500 rounded-full flex items-center justify-center hover:bg-red-200 transition-colors focus:outline-none" aria-label="Delete">
                            <i class="fas fa-trash text-sm"></i>
                        </button>
                    </div>
                `;
                transactionList.appendChild(item);
            });
        };

        // Add Transaction
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const type = document.querySelector('input[name="type"]:checked').value;
            const amount = parseFloat(amountInput.value);
            const description = descriptionInput.value.trim();
            const categoryElement = document.querySelector('input[name="category"]:checked');
            const category = categoryElement ? categoryElement.value : 'general';

            if (isNaN(amount) || amount <= 0 || description === '') {
                alert('Please enter a valid positive amount and description.');
                return;
            }

            const transaction = {
                id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
                type,
                amount,
                description,
                category,
                date: new Date().toISOString()
            };

            transactions.push(transaction);
            saveTransactions();
            
            // Reset form
            amountInput.value = '';
            descriptionInput.value = '';
            document.querySelector('input[name="category"][value="general"]').checked = true;
            amountInput.focus(); // keep focus for rapid entry
            
            updateUI();
        });

        // Delete Transaction
        window.deleteTransaction = (id) => {
            if(confirm('Are you sure you want to delete this transaction?')) {
                transactions = transactions.filter(t => t.id !== id);
                saveTransactions();
                updateUI();
            }
        };

        // Save to Local Storage
        const saveTransactions = () => {
            localStorage.setItem('expenseTracker_transactions', JSON.stringify(transactions));
        };

        // Export PDF
        window.exportToPDF = async () => {
            if (transactions.length === 0) {
                alert("No transactions to export!");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Sort by category, then date
            const sorted = [...transactions].sort((a, b) => {
                if (a.category < b.category) return -1;
                if (a.category > b.category) return 1;
                return new Date(b.date) - new Date(a.date);
            });

            // Totals
            const tIncome = transactions.filter(t => t.type === 'income').reduce((acc, curr) => acc + curr.amount, 0);
            const tExpense = transactions.filter(t => t.type === 'expense').reduce((acc, curr) => acc + curr.amount, 0);
            const balance = tIncome - tExpense;

            doc.setFontSize(22);
            doc.text("Expense Tracker Report", 14, 22);
            
            doc.setFontSize(12);
            doc.text(\`Date Generated: \${new Date().toLocaleDateString()}\`, 14, 32);
            doc.text(\`Total Income: \$\${tIncome.toFixed(2)}\`, 14, 40);
            doc.text(\`Total Expense: \$\${tExpense.toFixed(2)}\`, 14, 46);
            doc.text(\`Net Balance: \$\${balance.toFixed(2)}\`, 14, 52);

            const tableData = sorted.map(t => [
                new Date(t.date).toLocaleDateString(),
                t.category.charAt(0).toUpperCase() + t.category.slice(1),
                t.description,
                t.type === 'income' ? 'Income' : 'Expense',
                (t.type === 'income' ? '+' : '-') + '$' + t.amount.toFixed(2)
            ]);

            doc.autoTable({
                startY: 60,
                head: [['Date', 'Category', 'Description', 'Type', 'Amount']],
                body: tableData,
                theme: 'striped',
                headStyles: { fillColor: [79, 70, 229] }
            });

            const pdfBlob = doc.output('blob');
            
            // Web Share API
            if (navigator.canShare && navigator.canShare({ files: [new File([pdfBlob], 'report.pdf', { type: 'application/pdf' })] })) {
                try {
                    const file = new File([pdfBlob], 'ExpenseReport.pdf', { type: 'application/pdf' });
                    await navigator.share({
                        title: 'Expense Report',
                        text: 'Here is your expense tracker report.',
                        files: [file]
                    });
                } catch (error) {
                    console.log('Error sharing or user cancelled', error);
                }
            } else {
                // Fallback download if share not supported
                doc.save('ExpenseReport.pdf');
            }
        };

        // Initial render
        updateUI();
    </script>
</body>
</html>
